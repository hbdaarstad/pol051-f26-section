project:
  output-dir: docs
  type: website
  render:
    - "**/*.qmd"
    - "!files/**"
    - "!ae/files/**"
    - "!labs/**"
    - "!supplemental/r-basics.qmd"
    - "!supplemental/data-vis.qmd"
    - "!supplemental/data-wrangling.qmd"
    - "!supplemental/data-gen.qmd"
    - "!supplemental/models.qmd"
    - "!supplemental/hypothesis-tests.qmd"
  resources:
    - data/
    - files/
    - labs/
    - ae/files/

website:
  page-navigation: true
  title: "POL 051 - Summer 2026"
  description: "Homepage for POL 051 - The Scientific Study of Politics at UC Davis, Summer 2026."
  site-url: "https://haleydaarstad.com/pol051-f26-section/"

  repo-url: http://haleydaarstad.com/pol051-f26-section/
  repo-actions: [edit, issue]

  open-graph: true

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; Copyright 2026, Haley Daarstad"

  sidebar:
    logo: "images/logo.png"
    pinned: true
    align: center
    tools:
      - icon: clipboard-check
        href: https://login.canvas.ucdavis.edu/
        text: "Canvas"
      - icon: code-square
        href: https://posit.cloud
        text: "Posit Cloud"
      - icon: book
        text: "Course books"
        menu:
          - text: R for Data Science
            url: https://r4ds.hadley.nz/
          - text: ModernDive
            url: https://moderndive.com/v2/index.html
          - text: The Mixtape
            url: https://mixtape.scunning.com/

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - section: "Course information"
        contents:
          - href: course-overview.qmd
            text: Overview
          - href: course-syllabus.qmd
            text: Syllabus
          - href: index.qmd
            text: Schedule
          - href: course-faq.qmd
            text: FAQ
      - section: "Install Instructions"
        contents:
          - href: install/r.qmd
            text: "Installing R and R Studio"
          - href: install/posit-cloud.qmd
            text: "Cloud versions of R"
          - href: install/juanr.qmd
            text: "Installing juanr"
          - href: install/data.qmd
            text: "Uploading Data"
      - section: "Weekly materials"
        contents:
          - href: weeks/week-1.qmd
            text: "Week 1"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 2"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 3"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 4"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 5"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 6"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 7"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 8"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 9"
          - href: weeks/coming-soon-weeks.qmd
            text: "Week 10"
      - section: "Code Examples"
        contents:
          - href: supplemental/coming-soon-code.qmd
            text: R Basics
          - href: supplemental/coming-soon-code.qmd
            text: Data Visualization (ggplot2)
          - href: supplemental/coming-soon-code.qmd
            text: Data Wrangling (ggplot2)
          - href: supplemental/coming-soon-code.qmd
            text: Correlation
          - href: supplemental/coming-soon-code.qmd
            text: Linear Regression Models
          - href: supplemental/coming-soon-code.qmd
            text: Extra Materials

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    mainfont: "Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
    toc: true

freeze: auto

editor: visual